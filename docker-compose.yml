version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_api
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - .env
    depends_on:
      - database

  database:
    image: mongo:latest # Or postgres:15-alpine / mysql:8
    container_name: backend_db
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - db_data:/data/db

volumes:
  db_data:
