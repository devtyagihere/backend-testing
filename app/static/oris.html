                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-oris-steel block mb-1 uppercase text-[10px]">Load Port</label>
                        <input 
                          type="text" 
                          required
                          value={quoteForm.loadPort}
                          onChange={(e) => setQuoteForm({ ...quoteForm, loadPort: e.target.value })}
                          className="w-full bg-oris-pitch border border-white/10 rounded-xl px-4 py-3 text-white focus:border-white outline-none"
                          placeholder="e.g. Genoa"
                        />
                      </div>
                      <div>
                        <label className="text-oris-steel block mb-1 uppercase text-[10px]">Discharge Port</label>
                        <input 
                          type="text" 
                          required
                          value={quoteForm.dischargePort}
                          onChange={(e) => setQuoteForm({ ...quoteForm, dischargePort: e.target.value })}
                          className="w-full bg-oris-pitch border border-white/10 rounded-xl px-4 py-3 text-white focus:border-white outline-none"
                          placeholder="e.g. Alexandria"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="text-oris-steel block mb-1 uppercase text-[10px]">Quantity (MT)</label>
                      <input 
                        type="number" 
                        value={quoteForm.quantityMt}
                        onChange={(e) => setQuoteForm({ ...quoteForm, quantityMt: e.target.value })}
                        className="w-full bg-oris-pitch border border-white/10 rounded-xl px-4 py-3 text-white focus:border-white outline-none"
                        placeholder="8000"
                      />
                    </div>

                    <div>
                      <label className="text-oris-steel block mb-1 uppercase text-[10px]">Special Instructions</label>
                      <textarea 
                        rows="3"
                        value={quoteForm.message}
                        onChange={(e) => setQuoteForm({ ...quoteForm, message: e.target.value })}
                        className="w-full bg-oris-pitch border border-white/10 rounded-xl px-4 py-3 text-white focus:border-white outline-none"
                        placeholder="Laycan, temperature requirements, pump rates..."
                      ></textarea>
                    </div>

                    {quoteSuccess ? (
                      <div className="p-4 rounded-xl bg-emerald-950/80 border border-emerald-500 text-emerald-400">
                        Inquiry received. A chartering broker will reach out within 2 hours.
                      </div>
                    ) : (
                      <button 
                        type="submit"
                        className="w-full bg-white text-black font-semibold text-xs uppercase tracking-widest py-4 rounded-full hover:bg-slate-200 transition-all shadow-lg"
                      >
                        Request Instant Quote
                      </button>
                    )}
                  </form>

                </div>
              </div>
            )}
          </AnimatePresence>

        </div>
      );
    }

    // Render React Root
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<OrisMaritimeApp />);
  </script>
</body>
</html>
